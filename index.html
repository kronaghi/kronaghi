<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kambiz Ronaghi — We've moved</title>
  <meta http-equiv="refresh" content="10;url=https://www.ai-ronaghi.de">
  <style>
    :root{
      --darkred:#8b0000;
      --darkyellow:#c9a227;
      --ink:#fdf6e3;
      --duration:10s;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      display:grid;place-items:center;
      padding:24px;
      background:linear-gradient(45deg,var(--darkred) 0%,#5e0000 35%,#9a6b00 70%,var(--darkyellow) 100%);
      background-size:220% 220%;
      animation:drift 14s ease-in-out infinite;
      position:relative;overflow:hidden;
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(120% 90% at 50% 18%,transparent 40%,rgba(0,0,0,.55) 100%);
    }
    @keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .card{
      position:relative;z-index:1;
      max-width:560px;width:100%;
      padding:48px 40px;
      text-align:center;
      border-radius:24px;
      background:rgba(28,8,8,.55);
      border:1px solid rgba(201,162,39,.45);
      backdrop-filter:blur(14px) saturate(120%);
      -webkit-backdrop-filter:blur(14px) saturate(120%);
      box-shadow:
        0 30px 70px -20px rgba(0,0,0,.75),
        0 10px 24px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.10);
      animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

    .eyebrow{
      letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;
      color:var(--darkyellow);opacity:.9;margin-bottom:14px;
    }
    h1{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.15;font-weight:800;margin-bottom:10px}
    .sub{font-size:1rem;line-height:1.55;opacity:.88;margin-bottom:6px}
    .sub.de{font-size:.92rem;opacity:.62;margin-bottom:28px}

    .ring-wrap{position:relative;width:118px;height:118px;margin:6px auto 26px}
    svg{transform:rotate(-90deg)}
    .track{stroke:rgba(255,255,255,.14)}
    .progress{
      stroke:var(--darkyellow);stroke-linecap:round;
      stroke-dasharray:326.7;stroke-dashoffset:0;
      filter:drop-shadow(0 0 6px rgba(201,162,39,.6));
      animation:deplete var(--duration) linear forwards;
    }
    @keyframes deplete{to{stroke-dashoffset:326.7}}
    .count{
      position:absolute;inset:0;display:grid;place-items:center;
      font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;
    }
    .count small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.2em;
      text-transform:uppercase;opacity:.6;margin-top:2px}

    .go{
      display:inline-block;margin-top:4px;
      padding:14px 26px;border-radius:999px;
      font-weight:700;text-decoration:none;color:#1c0808;
      background:linear-gradient(45deg,var(--darkyellow),#f0d066);
      box-shadow:0 8px 22px -6px rgba(201,162,39,.7);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .go:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px rgba(201,162,39,.85)}
    .go .url{display:block;font-size:.78rem;font-weight:600;opacity:.7;margin-top:2px}

    noscript a{color:var(--darkyellow)}

    @media (prefers-reduced-motion:reduce){
      body{animation:none}
      .card{animation:none}
      .progress{animation:none;stroke-dashoffset:0}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <p class="eyebrow">Kambiz Ronaghi</p>
    <h1>This site has a new home</h1>
    <p class="sub">You'll be taken to my new website in a moment.</p>
    <p class="sub de">Sie werden in Kürze zu meiner neuen Website weitergeleitet.</p>

    <div class="ring-wrap" aria-hidden="true">
      <svg width="118" height="118" viewBox="0 0 118 118">
        <circle class="track"    cx="59" cy="59" r="52" fill="none" stroke-width="8"/>
        <circle class="progress" cx="59" cy="59" r="52" fill="none" stroke-width="8"/>
      </svg>
      <div class="count"><span id="num">10</span><small>seconds</small></div>
    </div>

    <a class="go" href="https://www.ai-ronaghi.de">
      Go to my new site now
      <span class="url">www.ai-ronaghi.de</span>
    </a>

    <noscript>
      <p class="sub" style="margin-top:20px">
        Redirecting in 10 seconds… or
        <a href="https://www.ai-ronaghi.de">click here</a>.
      </p>
    </noscript>
  </main>

  <script>
    (function(){
      var target = "https://www.ai-ronaghi.de";
      var n = 10, el = document.getElementById("num");
      var t = setInterval(function(){
        n--; if(el) el.textContent = n < 0 ? 0 : n;
        if(n <= 0) clearInterval(t);
      }, 1000);
      setTimeout(function(){ window.location.replace(target); }, 10000);
    })();
  </script>
</body>
</html>

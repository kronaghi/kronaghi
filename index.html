<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kambiz Ronaghi — We've moved</title>
  <meta http-equiv="refresh" content="10;url=https://www.ai-ronaghi.de">
  <style>
    :root{
      --deep:#0b3a66;      /* deep trust blue */
      --mid:#0e6ba8;       /* calm azure */
      --teal:#1f9aa6;      /* reassuring teal */
      --accent:#2dd4bf;    /* fresh, safe accent */
      --ink:#eaf4ff;
      --duration:10s;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      display:grid;place-items:center;
      padding:24px;
      background:linear-gradient(45deg,var(--deep) 0%,#0d4f86 35%,#157f9c 70%,var(--teal) 100%);
      background-size:220% 220%;
      animation:drift 16s ease-in-out infinite;
      position:relative;overflow:hidden;
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(120% 90% at 50% 18%,transparent 40%,rgba(2,12,24,.55) 100%);
    }
    @keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .card{
      position:relative;z-index:1;
      max-width:560px;width:100%;
      padding:48px 40px;
      text-align:center;
      border-radius:24px;
      background:rgba(8,24,40,.55);
      border:1px solid rgba(45,212,191,.40);
      backdrop-filter:blur(14px) saturate(120%);
      -webkit-backdrop-filter:blur(14px) saturate(120%);
      box-shadow:
        0 30px 70px -20px rgba(2,12,24,.75),
        0 10px 24px rgba(2,12,24,.45),
        inset 0 1px 0 rgba(255,255,255,.12);
      animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

    .eyebrow{
      letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;
      color:var(--accent);opacity:.95;margin-bottom:14px;
    }
    h1{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.15;font-weight:800;margin-bottom:10px}
    .sub{font-size:1rem;line-height:1.55;opacity:.9;margin-bottom:6px}
    .sub.de{font-size:.92rem;opacity:.64;margin-bottom:28px}

    .badge{
      display:inline-flex;align-items:center;gap:8px;
      font-size:.74rem;font-weight:600;letter-spacing:.02em;
      padding:7px 14px;margin-bottom:22px;border-radius:999px;
      color:var(--accent);
      background:rgba(45,212,191,.10);
      border:1px solid rgba(45,212,191,.35);
    }
    .badge svg{width:14px;height:14px;display:block}

    .ring-wrap{position:relative;width:118px;height:118px;margin:6px auto 26px}
    .ring-wrap svg.ring{transform:rotate(-90deg)}
    .track{stroke:rgba(255,255,255,.14)}
    .progress{
      stroke:var(--accent);stroke-linecap:round;
      stroke-dasharray:326.7;stroke-dashoffset:0;
      filter:drop-shadow(0 0 6px rgba(45,212,191,.6));
      animation:deplete var(--duration) linear forwards;
    }
    @keyframes deplete{to{stroke-dashoffset:326.7}}
    .count{
      position:absolute;inset:0;display:grid;place-items:center;
      font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;
    }
    .count small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.2em;
      text-transform:uppercase;opacity:.6;margin-top:2px}

    .go{
      display:inline-block;margin-top:4px;
      padding:14px 26px;border-radius:999px;
      font-weight:700;text-decoration:none;color:#06283d;
      background:linear-gradient(45deg,var(--accent),#99f6e4);
      box-shadow:0 8px 22px -6px rgba(45,212,191,.6);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .go:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px rgba(45,212,191,.8)}
    .go .url{display:block;font-size:.78rem;font-weight:600;opacity:.75;margin-top:2px}

    noscript a{color:var(--accent)}

    @media (prefers-reduced-motion:reduce){
      body{animation:none}
      .card{animation:none}
      .progress{animation:none;stroke-dashoffset:0}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <p class="eyebrow">Kambiz Ronaghi</p>

    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2l8 4v5c0 5-3.5 9-8 11-4.5-2-8-6-8-11V6z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      Secure &amp; official redirect
    </span>

    <h1>This site has a new home</h1>
    <p class="sub">You'll be safely taken to my new website in a moment.</p>
    <p class="sub de">Sie werden gleich sicher zu meiner neuen Website weitergeleitet.</p>

    <div class="ring-wrap" aria-hidden="true">
      <svg class="ring" width="118" height="118" viewBox="0 0 118 118">
        <circle class="track"    cx="59" cy="59" r="52" fill="none" stroke-width="8"/>
        <circle class="progress" cx="59" cy="59" r="52" fill="none" stroke-width="8"/>
      </svg>
      <div class="count"><span id="num">10</span><small>seconds</small></div>
    </div>

    <a class="go" href="https://www.ai-ronaghi.de">
      Go to my new site now
      <span class="url">www.ai-ronaghi.de</span>
    </a>

    <noscript>
      <p class="sub" style="margin-top:20px">
        Redirecting in 10 seconds… or
        <a href="https://www.ai-ronaghi.de">click here</a>.
      </p>
    </noscript>
  </main>

  <script>
    (function(){
      var target = "https://www.ai-ronaghi.de";
      var n = 10, el = document.getElementById("num");
      var t = setInterval(function(){
        n--; if(el) el.textContent = n < 0 ? 0 : n;
        if(n <= 0) clearInterval(t);
      }, 1000);
      setTimeout(function(){ window.location.replace(target); }, 10000);
    })();
  </script>
</body>
</html>
